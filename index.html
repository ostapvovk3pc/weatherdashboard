<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090c">
<title>Window Weather</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
  background: #07090c;
  color: #e6edf3;
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── BACKGROUND GLOW ── */
#bg-glow {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  transition: background 3s ease;
}

/* ── RIPPLE ── */
.ripple-layer {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 1; overflow: hidden;
}
.ripple-circle {
  position: absolute; border-radius: 50%;
  transform: translate(-50%,-50%) scale(0);
  opacity: 0;
  width: 200vmax; height: 200vmax;
  top: 50%; left: 50%;
}
.ripple-circle.animate-out {
  animation: rippleOut 2.4s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes rippleOut {
  0%   { transform:translate(-50%,-50%) scale(0); opacity:0.20; }
  60%  { opacity:0.09; }
  100% { transform:translate(-50%,-50%) scale(1); opacity:0; }
}
.ripple-circle.pulse-bad {
  animation: pulseBad 3s ease-in-out infinite;
}
@keyframes pulseBad {
  0%   { transform:translate(-50%,-50%) scale(0);    opacity:0; }
  35%  { opacity:0.13; }
  100% { transform:translate(-50%,-50%) scale(0.85); opacity:0; }
}

/* ── NIGHT OVERLAY ── */
#night-overlay {
  position: fixed; inset: 0;
  background: #000;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Start hidden */
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.2s ease, visibility 1.2s ease;
}
#night-overlay.active {
  opacity: 1;
  visibility: visible;
}
/* Peeking = overlay barely visible so dashboard shows through */
#night-overlay.peeking {
  opacity: 0.04;
  visibility: visible;
}

.night-btn {
  padding: 14px 28px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.45);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.4s ease;
  box-shadow: 0 0 30px rgba(255,255,255,0.04);
}
#night-overlay.active .night-btn {
  border-color: rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.6);
  box-shadow: 0 0 40px rgba(255,255,255,0.08);
}

/* ── MAIN LAYOUT ── */
.main {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px 20px 14px;
  padding-top: calc(16px + env(safe-area-inset-top));
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  gap: 14px;
}

/* ── HEADER ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.location {
  font-size: 15px; color: #6a7480;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.header-right { display:flex; gap:8px; align-items:center; }
.time-disp {
  font-size: 16px; color: #6a7480;
  font-variant-numeric: tabular-nums;
}
.refresh-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; color: #6a7480;
  padding: 6px 14px; cursor: pointer;
  font-family: 'DM Sans',sans-serif; font-size: 14px;
  transition: all 0.2s;
}
.refresh-btn:active { border-color:rgba(255,255,255,0.3); color:#e6edf3; }

/* ── MIDDLE SECTION (3 columns: left panels | planet | right panels) ── */
.middle {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 360px 1fr;
  gap: 14px;
  min-height: 0;
}

/* Left column */
.col-left {
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
}

/* Right column */
.col-right {
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
}

/* ── PLANET ── */
.planet-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
}

.emoji-top {
  font-size: 68px;
  line-height: 1;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.08));
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

.planet {
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 36%,
    rgba(255,255,255,0.07) 0%,
    rgba(255,255,255,0.01) 55%,
    transparent 100%
  ), rgba(255,255,255,0.025);
  border: 1.5px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: box-shadow 3s ease;
  flex-shrink: 0;
}

.temp-number {
  font-family: 'DM Sans', sans-serif;
  font-size: 193px;
  font-weight: 700;
  line-height: 0.9;
  letter-spacing: -6px;
  transition: color 2s ease;
}
.temp-deg {
  font-family: 'DM Sans', sans-serif;
  font-size: 60px;
  font-weight: 700;
  vertical-align: super;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0;
}
.feels-line {
  font-size: 13px;
  color: #6a7480;
  font-weight: 300;
  margin-top: 4px;
}

/* ── CARDS (shared) ── */
.card {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  padding: 18px 20px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color 0.5s ease, box-shadow 0.5s ease;
}

.card-label {
  font-size: 12px; color: #6a7480;
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 7px;
}
.card-icon { font-size: 22px; margin-bottom: 5px; }
.card-value {
  font-family: 'DM Sans', sans-serif;
  font-size: 32px; line-height: 1;
  font-weight: 700;
  transition: color 0.8s ease;
}
.card-value-sm {
  font-family: 'DM Sans', sans-serif;
  font-size: 20px; line-height: 1.25;
  font-weight: 600;
  transition: color 0.8s ease;
}

/* Status card */
.status-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.status-dot {
  width: 11px; height: 11px; border-radius: 50%;
  flex-shrink: 0; margin-top: 4px;
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.5; transform:scale(1.4); }
}
.status-msg {
  font-family: 'DM Sans', sans-serif;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.35;
}

/* ── WINDOW BUTTON ── */
.win-card {
  cursor: pointer;
  -webkit-appearance: none;
  font-family: 'DM Sans', sans-serif;
  color: #e6edf3;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: border-color 0.5s ease, background 0.5s ease, box-shadow 0.5s ease, transform 0.15s ease;
}
.win-card:active { transform: scale(0.96); }
.win-card.open {
  border-color: #3fb950;
  background: rgba(63,185,80,0.07);
  box-shadow: 0 0 18px rgba(63,185,80,0.15);
}
.win-card.open.warning {
  border-color: #d29922;
  background: rgba(210,153,34,0.08);
  animation: winFlashY 1.8s ease-in-out infinite;
}
.win-card.open.danger {
  border-color: #f85149;
  background: rgba(248,81,73,0.08);
  animation: winFlashR 1.2s ease-in-out infinite;
}
@keyframes winFlashY {
  0%,100% { box-shadow:0 0 12px rgba(210,153,34,0.1); }
  50%      { box-shadow:0 0 32px rgba(210,153,34,0.4); }
}
@keyframes winFlashR {
  0%,100% { box-shadow:0 0 12px rgba(248,81,73,0.1); }
  50%      { box-shadow:0 0 32px rgba(248,81,73,0.4); }
}
.win-icon-row {
  display: flex; align-items: center; gap: 10px;
}
.win-icon {
  font-size: 26px;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.win-card.open .win-icon { transform: rotate(-8deg) scale(1.1); }
.win-title { font-size: 18px; font-weight: 500; line-height: 1.2; }
.win-badge {
  font-size: 11px; padding: 4px 12px; border-radius: 100px;
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  align-self: flex-start;
  transition: all 0.4s ease;
}

/* ── COMFORT BAR ── */
.bar-section {
  flex-shrink: 0;
}
.bar-wrap {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 16px 22px 14px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.bar-top {
  display: flex; justify-content: space-between;
  margin-bottom: 10px;
}
.bar-label-txt {
  font-size: 12px; color: #6a7480;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.bar-track {
  position: relative; height: 18px; border-radius: 100px;
  background: linear-gradient(to right,
    #b71c1c 0%, #f85149 8%, #ff9800 18%, #ffc107 28%,
    #8bc34a 38%, #3fb950 50%,
    #8bc34a 62%, #ffc107 72%, #ff9800 82%, #f85149 92%, #b71c1c 100%
  );
  overflow: visible;
  margin-bottom: 8px;
}
.bar-arrow-wrap {
  position: absolute; top: -10px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  transition: left 1.4s cubic-bezier(0.34,1.2,0.64,1);
}
.bar-arrow {
  width:0; height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:14px solid white;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,0.8));
}
.bar-arrow-line { width:2px; height:22px; background:rgba(255,255,255,0.25); }
.bar-markers { display:flex; justify-content:space-between; margin-bottom:5px; }
.bar-marker { font-size:17px; font-weight:600; color:#8b949e; font-variant-numeric:tabular-nums; }
.bar-legend { display:flex; justify-content:space-between; }
.bar-legend span { font-size:12px; }

/* ── ENTRY ANIMATION ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
.fade-up { animation: fadeUp 0.5s cubic-bezier(0.34,1.2,0.64,1) both; }
</style>
</head>
<body>

<div id="bg-glow"></div>
<div class="ripple-layer">
  <div class="ripple-circle" id="ripple-circle"></div>
</div>

<!-- Night overlay — covers everything -->
<div id="night-overlay">
  <button class="night-btn" onclick="peekDashboard()">PEEK</button>
</div>

<!-- Main UI -->
<div class="main">

  <!-- Header -->
  <div class="header fade-up">
    <div class="location" id="loc-text">—</div>
    <div class="header-right">
      <div class="time-disp" id="clock">—</div>
      <button class="refresh-btn" id="refbtn" onclick="refreshWeather()">↻ Refresh</button>
    </div>
  </div>

  <!-- Middle: left | planet | right -->
  <div class="middle">

    <!-- LEFT -->
    <div class="col-left">

      <!-- Status -->
      <div class="card fade-up" style="animation-delay:0.07s">
        <div class="card-label">Conditions</div>
        <div class="status-card">
          <div class="status-dot" id="status-dot"></div>
          <div class="status-msg" id="status-text">—</div>
        </div>
      </div>

      <!-- Humidity -->
      <div class="card fade-up" style="animation-delay:0.12s">
        <div class="card-icon">💧</div>
        <div class="card-value" id="hum-val">—</div>
        <div class="card-label" style="margin-bottom:0;margin-top:2px">Humidity</div>
      </div>

      <!-- Wind -->
      <div class="card fade-up" style="animation-delay:0.17s">
        <div class="card-icon">💨</div>
        <div class="card-value" style="font-size:18px" id="wind-val">—</div>
        <div class="card-label" style="margin-bottom:0;margin-top:2px">Wind</div>
      </div>

    </div>

    <!-- PLANET CENTER -->
    <div class="planet-wrap fade-up" style="animation-delay:0.04s">
      <div class="emoji-top" id="emoji-el">—</div>
      <div class="planet" id="planet">
        <div class="temp-number" id="temp-num">—</div>
        <div class="feels-line" id="feels-line">—</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-right">

      <!-- Window toggle -->
      <button class="card win-card fade-up" id="win-btn" style="animation-delay:0.07s" onclick="toggleWindow()">
        <div class="card-label" style="margin-bottom:0">My Window</div>
        <div class="win-icon-row">
          <span class="win-icon" id="win-icon">🔒</span>
          <span class="win-title" id="win-title">Window is Closed</span>
        </div>
        <span class="win-badge" id="win-badge">CLOSED</span>
      </button>

      <!-- Suggestion -->
      <div class="card fade-up" style="animation-delay:0.12s">
        <div class="card-label">Suggested</div>
        <div class="card-icon" id="sug-icon">—</div>
        <div class="card-value-sm" id="sug-val">—</div>
      </div>

      <!-- Description -->
      <div class="card fade-up" style="animation-delay:0.17s">
        <div class="card-icon">🌡️</div>
        <div class="card-value-sm" id="desc-val" style="color:#8b949e">—</div>
        <div class="card-label" style="margin-bottom:0;margin-top:2px">Weather</div>
      </div>

    </div>
  </div>

  <!-- COMFORT BAR -->
  <div class="bar-section fade-up" style="animation-delay:0.22s">
    <div class="bar-wrap">
      <div class="bar-top">
        <span class="bar-label-txt">Comfort Scale</span>
        <span class="bar-label-txt" id="bar-range-label" style="color:#8b949e">—</span>
      </div>
      <div class="bar-track">
        <div class="bar-arrow-wrap" id="bar-arrow" style="left:50%">
          <div class="bar-arrow"></div>
          <div class="bar-arrow-line"></div>
        </div>
      </div>
      <div class="bar-markers" id="bar-markers"></div>
      <div class="bar-legend">
        <span style="color:#58a6ff">↙ Daily Low</span>
        <span style="color:#3fb950">✅ Ideal Zone</span>
        <span style="color:#f85149">Daily High ↘</span>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const COMFORT = {
  // < 68°F — too cold, red
  freezing:  { max:-10,      color:'#1d6af0', glowRgb:'29,106,240',  status:"Stay inside, it's freezing",   emoji:'🥶', recOpen:false, zone:'red'    },
  cold:      { max:4.4,      color:'#58a6ff', glowRgb:'88,166,255',  status:"Too cold to open the window",   emoji:'🧥', recOpen:false, zone:'red'    },
  chilly:    { max:20,       color:'#7dcfb6', glowRgb:'125,207,182', status:"Too cold outside",              emoji:'😬', recOpen:false, zone:'red'    },
  // 68–71°F (20–21.7°C) — yellow low
  coolish:   { max:21.7,     color:'#d29922', glowRgb:'210,153,34',  status:"A little cool outside",         emoji:'🙂', recOpen:false, zone:'yellow' },
  // 72–78°F (22.2–25.6°C) — green sweet spot
  nice:      { max:25.6,     color:'#3fb950', glowRgb:'63,185,80',   status:"It's nice outside — open it!",  emoji:'😊', recOpen:true,  zone:'green'  },
  // 78–85°F (25.6–29.4°C) — yellow warm
  warm:      { max:29.4,     color:'#d29922', glowRgb:'210,153,34',  status:"Warm, a bit stuffy outside",    emoji:'😅', recOpen:true,  zone:'yellow' },
  // > 85°F — too hot, red
  hot:       { max:34,       color:'#f0883e', glowRgb:'240,136,62',  status:"It's pretty hot outside",       emoji:'🥵', recOpen:false, zone:'red'    },
  scorching: { max:Infinity, color:'#f85149', glowRgb:'248,81,73',   status:"Way too hot, stay cool",        emoji:'🔥', recOpen:false, zone:'red'    },
};
const NIGHT_START = 0, NIGHT_END = 6;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let weatherData = null;
let windowOpen  = false;
let nightActive = false;
let peekTimeout = null;
let clockTick   = null;

// ═══════════════════════════════════
// HELPERS
// ═══════════════════════════════════
const toF  = c => Math.round(c * 9/5 + 32);
const fmtT = d => d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const fmtM = c => toF(c) + '°';

function getComfort(tempC) {
  for (const k of Object.keys(COMFORT))
    if (tempC < COMFORT[k].max) return {key:k, ...COMFORT[k]};
  return {key:'scorching', ...COMFORT.scorching};
}
function barPercent(tempC, lowC, highC) {
  // Add a small pad so arrow never sits right on the edge
  const pad = (highC - lowC) * 0.08;
  const min = lowC - pad, max = highC + pad;
  return Math.max(3, Math.min(97, (tempC - min) / (max - min) * 100));
}
function getWindNote(ms) {
  if (ms > 10) return ' Quite windy!';
  if (ms > 6)  return " It's breezy.";
  return '';
}
function getAlertState(comfort) {
  if (!windowOpen) return 'none';
  if (comfort.zone === 'green')  return 'none';
  if (comfort.zone === 'yellow') return 'warning';
  return 'danger';
}

// ═══════════════════════════════════
// BACKGROUND + PLANET GLOW
// ═══════════════════════════════════
function updateGlow(comfort) {
  const r = comfort.glowRgb;
  document.getElementById('bg-glow').style.background = `
    radial-gradient(ellipse 80% 80% at 50% 50%, rgba(${r},0.08) 0%, transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(${r},0.03) 0%, transparent 100%)
  `;
  const planet = document.getElementById('planet');
  if (planet) planet.style.boxShadow = `0 0 60px rgba(${r},0.22), 0 0 120px rgba(${r},0.08)`;
}

// ═══════════════════════════════════
// RIPPLE
// ═══════════════════════════════════
function startRipple(color) {
  const c = document.getElementById('ripple-circle');
  if (!c) return;
  c.style.background = color;
  c.classList.remove('animate-out','pulse-bad');
  void c.offsetWidth;
  c.classList.add('pulse-bad');
}
function stopRipple() {
  const c = document.getElementById('ripple-circle');
  if (!c) return;
  c.classList.remove('pulse-bad','animate-out');
  void c.offsetWidth;
  c.classList.add('animate-out');
  setTimeout(() => c.classList.remove('animate-out'), 2600);
}
function triggerOneRipple(color) {
  const c = document.getElementById('ripple-circle');
  if (!c) return;
  c.style.background = color;
  c.classList.remove('animate-out','pulse-bad');
  void c.offsetWidth;
  c.classList.add('animate-out');
}

// ═══════════════════════════════════
// WINDOW TOGGLE
// ═══════════════════════════════════
function toggleWindow() {
  windowOpen = !windowOpen;
  if (!weatherData) return;
  const comfort = getComfort(weatherData.tempC);
  const alert   = getAlertState(comfort);
  if (windowOpen) {
    if      (alert === 'none')    triggerOneRipple('rgba(63,185,80,1)');
    else if (alert === 'warning') startRipple('rgba(210,153,34,1)');
    else                          startRipple('rgba(248,81,73,1)');
  } else {
    stopRipple();
  }
  updateWindowUI(comfort);
}

function updateWindowUI(comfort) {
  const alert = getAlertState(comfort);
  const btn   = document.getElementById('win-btn');
  const badge = document.getElementById('win-badge');
  const icon  = document.getElementById('win-icon');
  const title = document.getElementById('win-title');
  if (!btn) return;

  btn.className = 'card win-card' + (windowOpen ? ' open' : '') + (windowOpen && alert !== 'none' ? ` ${alert}` : '');
  icon.textContent  = windowOpen ? '' : '🔒';
  title.textContent = windowOpen ? 'Window is Open :3' : 'Window is Closed';

  if (windowOpen) {
    if (alert === 'none')         { badge.style.cssText='background:rgba(63,185,80,0.15);color:#3fb950';  badge.textContent='OPEN'; }
    else if (alert === 'warning') { badge.style.cssText='background:rgba(210,153,34,0.15);color:#d29922'; badge.textContent='⚠ OPEN'; }
    else                          { badge.style.cssText='background:rgba(248,81,73,0.15);color:#f85149';  badge.textContent='🔴 OPEN'; }
  } else {
    badge.style.cssText = 'background:rgba(139,148,158,0.1);color:#6a7480';
    badge.textContent   = 'CLOSED';
  }

  // Sync ripple on weather refresh
  if (windowOpen) {
    const circle = document.getElementById('ripple-circle');
    if (alert === 'none') {
      if (circle && circle.classList.contains('pulse-bad')) stopRipple();
    } else {
      const color = alert === 'warning' ? 'rgba(210,153,34,1)' : 'rgba(248,81,73,1)';
      circle.style.background = color;
      if (!circle.classList.contains('pulse-bad')) startRipple(color);
    }
  }
}

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function render(data) {
  const { tempC, feelsLikeC, humidity, windMs, cityName, country, description } = data;
  const comfort  = getComfort(tempC);
  const dotColor = comfort.zone==='green' ? '#3fb950' : comfort.zone==='yellow' ? '#d29922' : '#f85149';

  // Header
  document.getElementById('loc-text').textContent = `📍 ${cityName}, ${country}`;
  document.getElementById('clock').textContent = fmtT(new Date());

  // Planet
  document.getElementById('temp-num').innerHTML = `${toF(tempC)}<span class="temp-deg">°F</span>`;
  document.getElementById('temp-num').style.color = comfort.color;
  document.getElementById('planet').style.boxShadow = `0 0 60px rgba(${comfort.glowRgb},0.22), 0 0 120px rgba(${comfort.glowRgb},0.08)`;
  document.getElementById('feels-line').textContent = `Feels like ${toF(feelsLikeC)}°F`;

  // Emoji
  document.getElementById('emoji-el').textContent = comfort.emoji;

  // Status
  const dot = document.getElementById('status-dot');
  dot.style.background = dotColor;
  dot.style.boxShadow  = `0 0 7px ${dotColor}`;
  document.getElementById('status-text').textContent = comfort.status + getWindNote(windMs);

  // Left cards
  document.getElementById('hum-val').textContent  = humidity + '%';
  document.getElementById('wind-val').textContent = Math.round(windMs * 2.237) + ' mph';

  // Right: suggestion ONLY here
  const sugIcon = document.getElementById('sug-icon');
  const sugVal  = document.getElementById('sug-val');
  sugIcon.textContent = comfort.recOpen ? '✅' : '🔒';
  sugVal.textContent  = comfort.recOpen ? 'Open it!' : 'Keep shut';
  sugVal.style.color  = dotColor;

  document.getElementById('desc-val').textContent = description;

  // Bar — scaled to today's actual high/low
  const lowC  = data.todayLowC;
  const highC = data.todayHighC;
  document.getElementById('bar-arrow').style.left = barPercent(tempC, lowC, highC) + '%';
  // Show: low on left, a midpoint, high on right
  const midC = (lowC + highC) / 2;
  document.getElementById('bar-markers').innerHTML = `
    <div class="bar-marker" style="color:#58a6ff">❄ ${toF(lowC)}°</div>
    <div class="bar-marker">${toF(midC)}°</div>
    <div class="bar-marker" style="color:#f85149">☀ ${toF(highC)}°</div>
  `;
  // Update legend to show today's range context
  document.getElementById('bar-range-label').textContent =
    `Today's range: ${toF(lowC)}° – ${toF(highC)}°F`;

  // Glow
  updateGlow(comfort);
  updateWindowUI(comfort);

  // Clock
  clearInterval(clockTick);
  clockTick = setInterval(() => {
    const el = document.getElementById('clock');
    if (el) el.textContent = fmtT(new Date());
  }, 15000);
}

// ═══════════════════════════════════
// NIGHT MODE
// ═══════════════════════════════════
function isNight() {
  const h = new Date().getHours();
  return h >= NIGHT_START && h < NIGHT_END;
}

function checkNightMode() {
  const ov = document.getElementById('night-overlay');
  if (isNight()) {
    if (!nightActive) {
      nightActive = true;
      ov.classList.add('active');
      ov.classList.remove('peeking');
    }
  } else {
    if (nightActive) {
      nightActive = false;
      ov.classList.remove('active', 'peeking');
    }
  }
}

function peekDashboard() {
  const ov = document.getElementById('night-overlay');
  // Make overlay nearly invisible so dashboard shows through
  ov.classList.remove('active');
  ov.classList.add('peeking');
  clearTimeout(peekTimeout);
  peekTimeout = setTimeout(() => {
    ov.classList.remove('peeking');
    ov.classList.add('active');
  }, 30000);
}

// ═══════════════════════════════════
// FETCH
// ═══════════════════════════════════
async function fetchWeather() {
  const geo = await (await fetch('https://ipapi.co/json/')).json();
  const { latitude, longitude, city, country_code } = geo;
  const w = await (await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=auto`
  )).json();
  const c = w.current;
  return {
    tempC:       c.temperature_2m,
    feelsLikeC:  c.apparent_temperature,
    humidity:    c.relative_humidity_2m,
    windMs:      c.wind_speed_10m,
    todayHighC:  w.daily.temperature_2m_max[0],
    todayLowC:   w.daily.temperature_2m_min[0],
    cityName:    city || 'Your City',
    country:     country_code || '',
    description: codeToDesc(c.weather_code),
  };
}

function codeToDesc(code) {
  return ({
    0:'Clear Sky', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
    45:'Foggy', 48:'Icy Fog',
    51:'Light Drizzle', 53:'Drizzle', 55:'Heavy Drizzle',
    61:'Light Rain', 63:'Rain', 65:'Heavy Rain',
    71:'Light Snow', 73:'Snow', 75:'Heavy Snow',
    80:'Rain Showers', 81:'Showers', 82:'Heavy Showers',
    95:'Thunderstorm', 96:'Thunderstorm + Hail',
  })[code] || 'Current Conditions';
}

async function refreshWeather() {
  const btn = document.getElementById('refbtn');
  if (btn) { btn.textContent = '↻ ...'; btn.disabled = true; }
  try {
    weatherData = await fetchWeather();
    render(weatherData);
    if (btn) { btn.textContent = '↻ Refresh'; btn.disabled = false; }
  } catch(e) {
    if (btn) { btn.textContent = '↻ Error'; btn.disabled = false; }
  }
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
(async () => {
  checkNightMode();
  setInterval(checkNightMode, 60000);
  try {
    weatherData = await fetchWeather();
    render(weatherData);
    setInterval(async () => {
      try { weatherData = await fetchWeather(); render(weatherData); } catch(_) {}
    }, 10 * 60 * 1000);
  } catch(e) {
    document.getElementById('loc-text').textContent = '⚠️ Could not load weather — check connection';
  }
})();
</script>
